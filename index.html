<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11100d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="《星渊引》古风剧情互动游戏 · 手机竖屏 WebGL 版">
  <meta property="og:title" content="星渊引">
  <meta property="og:description" content="古风剧情互动游戏 · 点击进入">
  <meta property="og:type" content="website">
  <title>星渊引 · WebGL V161</title>
  <style>
    :root { color-scheme: dark; background: #11100d; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; background: #11100d; font-family: "Songti SC", "Noto Serif SC", serif; touch-action: none; }
    #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; background: #11100d; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #11100d; outline: none; }
    #loading, #enter, #error, #rotate-hint { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
    #loading { flex-direction: column; gap: 18px; color: #e8d8b5; background: #11100d; }
    #loading-title { letter-spacing: .28em; font-size: 22px; }
    #progress-track { width: min(68vw, 320px); height: 3px; overflow: hidden; background: rgba(232,216,181,.18); }
    #progress-bar { width: 0; height: 100%; background: #b78b45; transition: width .12s linear; }
    #progress-text { color: rgba(232,216,181,.62); font-size: 13px; letter-spacing: .12em; }
    #enter { display: none; background: rgba(10,9,7,.58); backdrop-filter: blur(3px); }
    #enter-button { min-width: 190px; padding: 15px 28px; border: 1px solid rgba(216,179,103,.8); border-radius: 2px; color: #f2e5c8; background: rgba(43,52,38,.94); font: inherit; font-size: 17px; letter-spacing: .18em; }
    #error { display: none; padding: 28px; color: #f1dfc1; background: #17120f; text-align: center; line-height: 1.7; touch-action: auto; }
    #rotate-hint { display: none; z-index: 20; padding: 24px; color: #ead8b7; background: rgba(17,16,13,.96); text-align: center; letter-spacing: .12em; }
    @media (orientation: landscape) and (max-height: 600px) { html:not(.starabyss-map-open) #rotate-hint { display: flex; } }
  </style>
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
  </main>
  <section id="loading" aria-live="polite">
    <div id="loading-title">星渊引</div>
    <div id="progress-track"><div id="progress-bar"></div></div>
    <div id="progress-text">载入 WebGL V161 · 0%</div>
  </section>
  <section id="enter"><button id="enter-button" type="button">轻触进入</button></section>
  <section id="error"></section>
  <aside id="rotate-hint">请将手机转回竖屏</aside>
  <script>
    const VERBOSE = false;
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const progressBar = document.querySelector("#progress-bar");
    const progressText = document.querySelector("#progress-text");
    const enter = document.querySelector("#enter");
    const enterButton = document.querySelector("#enter-button");
    const errorPanel = document.querySelector("#error");
    const runtimeUrls = Object.freeze({"loader":"Build/c4993223e9c54698efec77210caa2113b92f5870cd153eea1ddf763e74cc9d10/StarAbyss-WebGL-WeChat.loader.js","framework":"Build/c4993223e9c54698efec77210caa2113b92f5870cd153eea1ddf763e74cc9d10/StarAbyss-WebGL-WeChat.framework.js.unityweb","wasm":"Build/c4993223e9c54698efec77210caa2113b92f5870cd153eea1ddf763e74cc9d10/StarAbyss-WebGL-WeChat.wasm.unityweb"});
    const reconstructionModule = "./Build/b952f208ef655c8235a5dbad0fae6d20d27de24f8ad2e810d39696e4807eaee4/reconstruct-raw.2d2a9a339472e24ca3c6f504e4a57b4a41f7e56e9323e40b3f6109bd6b7530e0.mjs";
    const dataRecipe = Object.freeze({"recipe":{"path":"Build/b952f208ef655c8235a5dbad0fae6d20d27de24f8ad2e810d39696e4807eaee4/StarAbyss.raw.reuse.c24b929455b5f652d439405e73dcf122545d55cbf10ceb8074ecb88543c6ad51.json","bytes":223942,"sha256":"c24b929455b5f652d439405e73dcf122545d55cbf10ceb8074ecb88543c6ad51"},"output":{"bytes":338545085,"sha256":"b952f208ef655c8235a5dbad0fae6d20d27de24f8ad2e810d39696e4807eaee4"},"baseParts":14,"literalFiles":12});
    const query = new URLSearchParams(window.location.search);
    const cacheVersion = query.get("v") || "161.0.0";
    const cacheSuffix = "?v=" + encodeURIComponent(cacheVersion) + "&build=04031252a8318d32";
    const salt = window.__ENTRY_SALT__ || "starabyss-mobile-entry-v161";
    const PRODUCT = "星渊引";
    const VERSION = "161.0.0";
    const loaderUrl = runtimeUrls.loader + cacheSuffix;
    const config = {
      dataUrl: "",
      frameworkUrl: runtimeUrls.framework + cacheSuffix,
      codeUrl: runtimeUrls.wasm + cacheSuffix,
      streamingAssetsUrl: "StreamingAssets/c5ae0326029bb868006ca43e80db8284f66ced318966920e2e138b919d442053",
      companyName: "VoidVerse Studio",
      productName: "星渊引",
      productVersion: "161.0.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      autoSyncPersistentDataPath: true,
      showBanner: (message, type) => {
        if (type === "error") showError(message);
        else if (VERBOSE && console && console.warn) console.warn(message);
      }
    };

    function showError(message) {
      loading.style.display = "none";
      enter.style.display = "none";
      const fallback = "WebGL V161 入口校验失败，请使用 HTTPS 分享地址重新打开。";
      const detail = (message && message !== true && VERBOSE) ? (" " + message) : "";
      errorPanel.textContent = fallback + detail;
      errorPanel.style.display = "flex";
    }

    function toHex(bytes) {
      return Array.from(bytes).map(value => value.toString(16).padStart(2, "0")).join("");
    }

    async function sha256Hex(text) {
      const data = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return toHex(new Uint8Array(digest));
    }

    function secureCompare(a, b) {
      if (a.length !== b.length) return false;
      let result = 0;
      for (let i = 0; i < a.length; i++) result |= a.charCodeAt(i) ^ b.charCodeAt(i);
      return result === 0;
    }

    async function verifyEntranceSignature() {
      if (query.getAll("sig").length > 1 || query.getAll("v").length > 1) return false;
      const sigParam = query.get("sig");
      // Public compatibility checksum, not authentication or authorization.
      const expected = await sha256Hex(cacheVersion + "|" + PRODUCT + "|" + VERSION + "|" + salt);
      if (sigParam === null) {
        const localPreview = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        if (!window.isSecureContext && !localPreview) return false;
        query.set("sig", expected);
        window.history.replaceState(null, "", window.location.pathname + "?" + query.toString() + window.location.hash);
        return true;
      }
      if (!/^[0-9a-f]{64}$/i.test(sigParam)) return false;
      if (secureCompare(expected, sigParam.toLowerCase())) return true;
      const previousVersions = ["160.0.0", "159.0.0", "158.0.0"];
      for (const previousVersion of previousVersions) {
        const previousCache = query.get("v") || previousVersion;
        const previousSalt = "starabyss-mobile-entry-v" + previousVersion.split(".")[0];
        const previous = await sha256Hex(previousCache + "|" + PRODUCT + "|" + previousVersion + "|" + previousSalt);
        if (!secureCompare(previous, sigParam.toLowerCase())) continue;
        query.set("sig", expected);
        window.history.replaceState(null, "", window.location.pathname + "?" + query.toString() + window.location.hash);
        return true;
      }
      return false;
    }

    canvas.addEventListener("contextmenu", event => event.preventDefault());
    canvas.addEventListener("touchmove", event => event.preventDefault(), { passive: false });

    async function prepareChunkedData() {
      const moduleUrl = reconstructionModule + cacheSuffix;
      const shipped = await import(moduleUrl);
      const baseUrl = new URL("./", window.location.href).href;
      const readSource = shipped.createPublicAssetReader({ baseUrl, allowLocalPreview: true });
      const recipeBytes = await readSource(dataRecipe.recipe);
      const total = dataRecipe.baseParts + dataRecipe.literalFiles;
      const raw = await shipped.reconstructRawArchive(recipeBytes, {
        recipeSha256: dataRecipe.recipe.sha256,
        expectedOutput: dataRecipe.output,
        readSource,
        onProgress: state => {
          const done = state.phase === "base" ? state.part : dataRecipe.baseParts + (state.part || dataRecipe.literalFiles);
          const percent = state.phase === "complete" ? 55 : Math.min(54, Math.round((done / Math.max(1, total)) * 54));
          progressBar.style.width = percent + "%";
          progressText.textContent = "载入 WebGL V161 · " + percent + "%";
        }
      });
      return URL.createObjectURL(new Blob([raw], { type: "application/octet-stream" }));
    }

    (async () => {
      const ok = await verifyEntranceSignature();
      if (!ok) {
        if (VERBOSE && console && console.warn) {
          console.warn("WebGL entry signature validation failed.");
        }
        showError();
        return;
      }

      try {
        config.dataUrl = await prepareChunkedData();
      } catch (error) {
        if (VERBOSE && console && console.error) console.error(error);
        showError("WebGL V161 资源包载入失败。");
        return;
      }

      const loader = document.createElement("script");
      loader.src = loaderUrl;
      loader.onload = () => {
        createUnityInstance(canvas, config, progress => {
          const percent = 55 + Math.round(progress * 45);
          progressBar.style.width = percent + "%";
          progressText.textContent = "载入 WebGL V161 · " + percent + "%";
        }).then(unityInstance => {
          URL.revokeObjectURL(config.dataUrl);
          loading.style.display = "none";
          enter.style.display = "flex";
          let hasEntered = false;
          const enterGame = event => {
            if (hasEntered) return;
            hasEntered = true;
            if (event && event.cancelable) event.preventDefault();
            // Unity Web Audio defaults to iOS' ambient session, which is muted by
            // the Ring/Silent switch. Safari 17+ exposes the playback category so
            // user-requested game music remains audible in silent mode.
            try {
              if (navigator.audioSession) navigator.audioSession.type = "playback";
            } catch {
            }
            // Keep SendMessage in the original pointer/touch call stack so iOS
            // recognizes the Web Audio resume as a genuine user gesture.
            unityInstance.SendMessage("StarAbyssGame", "UnlockWebAudio");
            enter.remove();
            canvas.focus();
          };
          if (window.PointerEvent) {
            enterButton.addEventListener("pointerdown", enterGame, { once: true });
          } else {
            enterButton.addEventListener("touchstart", enterGame, { once: true, passive: false });
            enterButton.addEventListener("mousedown", enterGame, { once: true });
          }
          enterButton.addEventListener("click", enterGame, { once: true });
        }).catch(() => showError("WebGL V161 运行时启动失败。"));
      };
      loader.onerror = () => showError("WebGL V161 入口加载失败。");
      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
